name: Deploy Avlod Web
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**"
      - ".github/workflows/deploy.yml"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate app icons
        run: |
          python -m pip install Pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          for size in (192,512):
            im=Image.new("RGB",(size,size),"#102b24")
            d=ImageDraw.Draw(im)
            f=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",int(size*.62))
            b=d.textbbox((0,0),"A",font=f)
            d.text(((size-(b[2]-b[0]))/2-b[0],(size-(b[3]-b[1]))/2-b[1]-size*.035),"A",font=f,fill="#e0bd73")
            d.rounded_rectangle((size*.25,size*.86,size*.75,size*.885),radius=max(1,int(size*.01)),fill="#f4f6f3")
            im.save(f"icon-{size}.png",optimize=True)
          PY
      - name: Validate JavaScript
        run: node --check app.js
      - name: Validate Avlod GPT integration
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          js = Path("app.js").read_text(encoding="utf-8")
          css = Path("styles.css").read_text(encoding="utf-8")
          required_html = ['id="screen-ai"', 'id="aiForm"', 'id="aiReceipt"', 'id="aiVoice"', 'data-tab="ai"']
          required_js = ["functions/v1/avlod-gpt", "getSession()", "data-ai-action", "SpeechRecognition", "readAsDataURL"]
          missing = [item for item in required_html if item not in html] + [item for item in required_js if item not in js]
          if missing:
              raise SystemExit("Avlod GPT integration checks failed: " + ", ".join(missing))
          if "sk-" in js or "OPENAI_API_KEY" in js:
              raise SystemExit("OpenAI secret must never be shipped to the browser.")
          if ".ai-form" not in css or ".ai-bubble" not in css:
              raise SystemExit("Avlod GPT styles are missing.")
          print("Avlod GPT UI, authenticated endpoint, voice and receipt hooks verified.")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
