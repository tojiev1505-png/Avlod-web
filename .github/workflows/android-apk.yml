name: Build Avlod Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "index.html"
      - "styles.css"
      - "manifest.webmanifest"
      - "icon.svg"
      - "sw.js"
      - ".github/workflows/android-apk.yml"
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest Avlod
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare web assets
        run: |
          node --check app.js
          mkdir -p www
          cp index.html app.js styles.css manifest.webmanifest sw.js icon.svg www/
          python -m pip install Pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          for size in (192, 512):
              im = Image.new("RGB", (size, size), "#102b24")
              draw = ImageDraw.Draw(im)
              font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", int(size * .62))
              box = draw.textbbox((0, 0), "A", font=font)
              draw.text(((size-(box[2]-box[0]))/2-box[0], (size-(box[3]-box[1]))/2-box[1]-size*.035), "A", font=font, fill="#e0bd73")
              im.save(f"www/icon-{size}.png", optimize=True)
          PY
      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7
      - name: Configure Android wrapper
        run: |
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.avlod.family",
            "appName": "Avlod",
            "webDir": "www",
            "androidScheme": "https",
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 0
              }
            }
          }
          JSON
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: avlod-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
